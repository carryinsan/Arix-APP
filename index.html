
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arix-APP - GitHub + Vercel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0e0e10; color: #fff;}
        .hidden { display: none !important; }
        .sidebar { background: #18181b; border-right: 1px solid #333; }
        .file-item:hover { background: #27272a; cursor: pointer; }
        .file-item.active { background: #3f3f46; }
        #editor-container { width: 100%; height: calc(100vh - 60px); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-[#18181b] border-b border-gray-800 h-[60px]">
        <div class="font-bold text-xl tracking-tight text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Arix-APP
        </div>
        <div id="auth-controls" class="flex gap-4 items-center">
            <span id="user-info" class="text-gray-400 text-sm hidden"></span>
            <button id="btn-login" class="bg-white text-black px-4 py-1.5 rounded font-medium hover:bg-gray-200">Login</button>
            <button id="btn-logout" class="bg-red-600 text-white px-4 py-1.5 rounded font-medium hover:bg-red-700 hidden">Logout</button>
        </div>
    </header>

    <!-- Login Screen -->
    <div id="screen-login" class="flex-1 flex items-center justify-center hidden">
        <div class="bg-[#18181b] p-8 rounded-lg border border-gray-800 w-96 flex flex-col gap-4 text-center">
            <h2 class="text-2xl font-bold mb-4">Welcome to Arix</h2>
            <a href="/api/platform/oauth/github" class="w-full bg-[#24292e] text-white py-2 rounded hover:bg-[#333] transition flex justify-center items-center gap-2">
                Sign in with GitHub
            </a>
            <div class="text-gray-500 text-sm my-2">OR</div>
            <form id="dev-login-form" class="flex flex-col gap-3">
                <input type="email" id="dev-email" placeholder="Email Address" class="w-full bg-[#0e0e10] border border-gray-700 p-2 rounded text-white" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Continue with Email</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="screen-dashboard" class="flex-1 p-8 hidden max-w-5xl mx-auto w-full">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">Your Projects</h2>
            <button id="btn-new-project" class="bg-white text-black px-4 py-2 rounded font-medium hover:bg-gray-200">New Project</button>
        </div>
        
        <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-12">
            <!-- Projects injected here -->
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">API Keys (For AI Deployments)</h2>
            <button id="btn-new-apikey" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">Generate Key</button>
        </div>
        <div id="apikeys-list" class="bg-[#18181b] border border-gray-800 rounded-lg p-4 flex flex-col gap-2">
            <!-- Keys injected here -->
        </div>
    </div>

    <!-- IDE Screen -->
    <div id="screen-ide" class="flex-1 flex hidden overflow-hidden">
        
        <!-- Sidebar -->
        <div class="sidebar w-64 flex flex-col">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <div class="font-semibold text-sm truncate" id="ide-project-name">Project</div>
                <a href="#" id="ide-project-link" target="_blank" class="text-blue-500 hover:text-blue-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
            
            <div class="p-2 border-b border-gray-800 flex gap-2">
                <button id="btn-new-file" class="flex-1 text-xs bg-gray-800 hover:bg-gray-700 p-1.5 rounded border border-gray-700">New File</button>
                <button id="btn-env-vars" class="flex-1 text-xs bg-gray-800 hover:bg-gray-700 p-1.5 rounded border border-gray-700">Env Vars</button>
            </div>
            
            <div id="file-tree" class="flex-1 overflow-y-auto p-2 text-sm text-gray-300 flex flex-col gap-1">
                <!-- Files injected here -->
            </div>
            
            <div class="p-4 border-t border-gray-800">
                <button id="btn-deploy" class="w-full bg-white text-black py-2 rounded font-semibold hover:bg-gray-200">Save & Deploy</button>
                <button id="btn-back-dashboard" class="w-full mt-2 text-gray-400 text-sm hover:text-white py-1">Back to Dashboard</button>
            </div>
        </div>
        
        <!-- Editor -->
        <div class="flex-1 flex flex-col relative">
            <div id="editor-container"></div>
            
            <!-- Env Vars Modal (Overlay) -->
            <div id="env-modal" class="absolute inset-0 bg-[#0e0e10]/95 z-10 hidden flex flex-col p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Environment Variables</h3>
                    <button id="btn-close-env" class="text-gray-400 hover:text-white">&times; Close</button>
                </div>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="env-key" placeholder="Key (e.g. API_KEY)" class="flex-1 bg-[#18181b] border border-gray-700 p-2 rounded text-white">
                    <input type="password" id="env-val" placeholder="Value" class="flex-1 bg-[#18181b] border border-gray-700 p-2 rounded text-white">
                    <button id="btn-add-env" class="bg-blue-600 px-4 py-2 rounded">Add</button>
                </div>
                <div id="env-list" class="flex-1 overflow-y-auto border border-gray-800 rounded bg-[#18181b] p-4"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let currentUser = null;
        let projects = [];
        let apiKeys = [];
        let currentProject = null;
        let files = {};
        let currentFilePath = null;
        let editor = null;

        // Init Monaco
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// Select a file',
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });
            
            editor.onDidChangeModelContent(() => {
                if(currentFilePath && files[currentFilePath] !== undefined) {
                    files[currentFilePath] = editor.getValue();
                }
            });
            
            // Check auth after monaco loads
            checkAuth();
        });

        // DOM Elements
        const screens = {
            login: document.getElementById('screen-login'),
            dashboard: document.getElementById('screen-dashboard'),
            ide: document.getElementById('screen-ide')
        };
        const elUserInfo = document.getElementById('user-info');
        const elBtnLogin = document.getElementById('btn-login');
        const elBtnLogout = document.getElementById('btn-logout');

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        async function apiCall(path, method = 'GET', body = null) {
            const opts = { method, headers: {} };
            if (body) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch('/api/platform' + path, opts);
            if(res.status === 401) {
                currentUser = null;
                updateAuthUI();
                showScreen('login');
                throw new Error("Unauthorized");
            }
            return res.json();
        }

        async function checkAuth() {
            try {
                const data = await apiCall('/me');
                if (data && data.userId) {
                    currentUser = data;
                    updateAuthUI();
                    loadDashboard();
                }
            } catch (e) {
                showScreen('login');
            }
        }

        function updateAuthUI() {
            if (currentUser) {
                elUserInfo.textContent = currentUser.name || currentUser.email;
                elUserInfo.classList.remove('hidden');
                elBtnLogin.classList.add('hidden');
                elBtnLogout.classList.remove('hidden');
                showScreen('dashboard');
            } else {
                elUserInfo.classList.add('hidden');
                elBtnLogin.classList.remove('hidden');
                elBtnLogout.classList.add('hidden');
                showScreen('login');
            }
        }

        // Login Handlers
        elBtnLogin.onclick = () => showScreen('login');
        elBtnLogout.onclick = async () => {
            await apiCall('/logout', 'POST');
            currentUser = null;
            updateAuthUI();
        };

        document.getElementById('dev-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('dev-email').value;
            await apiCall('/devlogin', 'POST', { email });
            checkAuth();
        };

        // Dashboard
        async function loadDashboard() {
            projects = await apiCall('/projects');
            apiKeys = await apiCall('/apikeys');
            renderProjects();
            renderApiKeys();
        }

        function renderProjects() {
            const list = document.getElementById('projects-list');
            list.innerHTML = projects.map(p => `
                <div class="bg-[#18181b] border border-gray-800 rounded-lg p-5 flex flex-col justify-between hover:border-gray-600 transition">
                    <div>
                        <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                        <a href="https://${p.slug}.arix-app.vercel.com" target="_blank" class="text-sm text-blue-400 hover:underline">
                            ${p.slug}.arix-app.vercel.com
                        </a>
                    </div>
                    <button class="mt-4 bg-gray-800 text-white px-4 py-1.5 rounded text-sm hover:bg-gray-700 w-full" onclick="openProject('${p.id}')">
                        Open Editor
                    </button>
                </div>
            `).join('');
            if(projects.length === 0) list.innerHTML = '<p class="text-gray-500">No projects yet. Create one!</p>';
        }

        function renderApiKeys() {
            const list = document.getElementById('apikeys-list');
            list.innerHTML = apiKeys.map(k => `
                <div class="flex justify-between items-center p-2 bg-[#0e0e10] rounded border border-gray-800">
                    <code class="text-sm text-green-400">${k}</code>
                    <button onclick="deleteApiKey('${k}')" class="text-red-500 text-sm hover:underline">Revoke</button>
                </div>
            `).join('');
            if(apiKeys.length === 0) list.innerHTML = '<span class="text-gray-500">No API keys.</span>';
        }

        document.getElementById('btn-new-project').onclick = async () => {
            const name = prompt("Project Name:");
            if(!name) return;
            const slug = prompt("Subdomain Slug (e.g. my-app):", name.toLowerCase().replace(/[^a-z0-9-]/g, ''));
            if(!slug) return;
            try {
                await apiCall('/projects', 'POST', { name, slug });
                loadDashboard();
            } catch (e) {
                alert("Error: " + (e.error || e.message));
            }
        };

        document.getElementById('btn-new-apikey').onclick = async () => {
            await apiCall('/apikeys', 'POST');
            loadDashboard();
        };

        window.deleteApiKey = async (key) => {
            if(!confirm("Revoke this key?")) return;
            await apiCall('/apikeys', 'DELETE', { key });
            loadDashboard();
        };

        // IDE
        window.openProject = async (id) => {
            currentProject = projects.find(p => p.id === id);
            document.getElementById('ide-project-name').textContent = currentProject.name;
            document.getElementById('ide-project-link').href = `https://${currentProject.slug}.arix-app.vercel.com`;
            
            // Load files
            files = await apiCall(`/projects/${id}/files`);
            if (Object.keys(files).length === 0) {
                files['/index.html'] = '<h1>Hello</h1>';
            }
            renderFileTree();
            
            // Open first file
            const first = Object.keys(files).sort()[0];
            if (first) openFile(first);
            
            showScreen('ide');
        };

        document.getElementById('btn-back-dashboard').onclick = () => {
            currentProject = null;
            showScreen('dashboard');
            loadDashboard();
        };

        function renderFileTree() {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = Object.keys(files).sort().map(path => `
                <div class="file-item flex justify-between items-center p-1.5 rounded ${path === currentFilePath ? 'active' : ''}" onclick="openFile('${path}')">
                    <span class="truncate">${path}</span>
                    <button class="text-red-500 hover:text-red-400 text-xs hidden-until-hover px-1" onclick="deleteFile('${path}', event)">&times;</button>
                </div>
            `).join('');
        }

        window.openFile = (path) => {
            currentFilePath = path;
            const ext = path.split('.').pop().toLowerCase();
            let lang = 'javascript';
            if (ext === 'html') lang = 'html';
            else if (ext === 'css') lang = 'css';
            else if (ext === 'json') lang = 'json';
            
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(files[path] || '');
            renderFileTree();
        };

        document.getElementById('btn-new-file').onclick = () => {
            let path = prompt("File path (e.g. /api/users.js or /index.html):", "/");
            if(!path) return;
            if(!path.startsWith('/')) path = '/' + path;
            if(!files[path]) {
                files[path] = '';
                openFile(path);
            }
        };

        window.deleteFile = (path, e) => {
            e.stopPropagation();
            if(!confirm(`Delete ${path}?`)) return;
            delete files[path];
            if(currentFilePath === path) {
                editor.setValue('// File deleted');
                currentFilePath = null;
            }
            renderFileTree();
        };

        // Deploy
        document.getElementById('btn-deploy').onclick = async () => {
            const btn = document.getElementById('btn-deploy');
            const og = btn.textContent;
            btn.textContent = "Deploying...";
            btn.disabled = true;
            
            try {
                // Get existing on server to sync deletions
                const remoteFiles = await apiCall(`/projects/${currentProject.id}/files`);
                
                // Delete removed files
                for(let rp of Object.keys(remoteFiles)) {
                    if(files[rp] === undefined) {
                        await apiCall(`/projects/${currentProject.id}/files`, 'DELETE', { path: rp });
                    }
                }
                
                // Upload current files
                for(let path of Object.keys(files)) {
                    await apiCall(`/projects/${currentProject.id}/files`, 'POST', {
                        path: path,
                        content: files[path]
                    });
                }
                
                btn.textContent = "Saved & Deployed!";
                setTimeout(() => btn.textContent = og, 2000);
            } catch (e) {
                alert("Deploy failed: " + e.message);
                btn.textContent = og;
            }
            btn.disabled = false;
        };

        // Env Vars
        const envModal = document.getElementById('env-modal');
        document.getElementById('btn-env-vars').onclick = async () => {
            envModal.classList.remove('hidden');
            await loadEnvVars();
        };
        document.getElementById('btn-close-env').onclick = () => envModal.classList.add('hidden');

        async function loadEnvVars() {
            const envs = await apiCall(`/projects/${currentProject.id}/env`);
            const list = document.getElementById('env-list');
            list.innerHTML = Object.keys(envs).map(k => `
                <div class="flex justify-between items-center py-2 border-b border-gray-800">
                    <span class="font-mono text-sm">${k}</span>
                    <button class="text-red-500 text-sm hover:underline" onclick="deleteEnv('${k}')">Remove</button>
                </div>
            `).join('');
            if(Object.keys(envs).length === 0) list.innerHTML = '<span class="text-gray-500">No environment variables set.</span>';
        }

        document.getElementById('btn-add-env').onclick = async () => {
            const k = document.getElementById('env-key').value;
            const v = document.getElementById('env-val').value;
            if(!k) return;
            await apiCall(`/projects/${currentProject.id}/env`, 'POST', { key: k, value: v });
            document.getElementById('env-key').value = '';
            document.getElementById('env-val').value = '';
            loadEnvVars();
        };

        window.deleteEnv = async (key) => {
            await apiCall(`/projects/${currentProject.id}/env`, 'DELETE', { key });
            loadEnvVars();
        };

    </script>
</body>
</html>
