<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arix-APP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .full-height { height: calc(100vh - 64px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 h-16 flex items-center justify-between px-6">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-white tracking-wide">Arix-APP</h1>
            <span class="px-2 py-1 bg-blue-600/20 text-blue-400 rounded text-xs border border-blue-600/30">Beta</span>
        </div>
        <div id="user-controls" class="flex items-center space-x-4">
            <!-- Will be populated with login buttons or user info -->
            <button id="login-github-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded shadow transition flex items-center space-x-2">
                <i class="fab fa-github"></i>
                <span>Login with GitHub</span>
            </button>
            <button id="login-google-btn" class="bg-white hover:bg-gray-100 text-gray-900 px-4 py-2 rounded shadow transition flex items-center space-x-2">
                <i class="fab fa-google text-blue-500"></i>
                <span>Login with Google</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar (File Tree) -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Explorer</h2>
                <div class="flex space-x-2">
                    <button id="new-file-btn" class="text-gray-400 hover:text-white" title="New File"><i class="fas fa-file-medical"></i></button>
                    <button id="new-folder-btn" class="text-gray-400 hover:text-white" title="New Folder"><i class="fas fa-folder-plus"></i></button>
                </div>
            </div>
            <div id="file-tree" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- File tree will be rendered here -->
                <div class="text-gray-500 text-sm p-2">Loading...</div>
            </div>
        </aside>

        <!-- Editor Area -->
        <section class="flex-1 flex flex-col min-w-0 bg-gray-900">
            <!-- Tabs -->
            <div id="editor-tabs" class="flex bg-gray-800 border-b border-gray-700 overflow-x-auto h-10">
                <!-- Tabs will be rendered here -->
            </div>
            
            <!-- Editor Container -->
            <div id="editor-container" class="flex-1 relative">
                <!-- Monaco editor will be injected here -->
                <div class="absolute inset-0 flex items-center justify-center text-gray-500">
                    Select a file to edit
                </div>
            </div>
        </section>

        <!-- Right Panel (Settings & Deployment) -->
        <aside class="w-80 bg-gray-800 border-l border-gray-700 flex flex-col overflow-y-auto">
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-lg font-semibold text-white mb-4">Deployment</h2>
                <button id="deploy-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded shadow transition flex justify-center items-center space-x-2">
                    <i class="fas fa-rocket"></i>
                    <span>Deploy Project</span>
                </button>
                <div id="deploy-status" class="mt-4 text-sm hidden">
                    <p class="text-gray-400">Status: <span id="deploy-status-text" class="text-yellow-400">Deploying...</span></p>
                    <a id="deploy-link" href="#" target="_blank" class="text-blue-400 hover:underline mt-2 block break-all hidden"></a>
                </div>
            </div>

            <div class="p-4 border-b border-gray-700">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Environment Variables</h2>
                <div id="env-vars-container" class="space-y-2 mb-3">
                    <!-- Env vars list -->
                </div>
                <button id="add-env-btn" class="text-sm text-blue-400 hover:text-blue-300 flex items-center space-x-1">
                    <i class="fas fa-plus"></i>
                    <span>Add Variable</span>
                </button>
            </div>
            
            <div class="p-4">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">API Key</h2>
                <div class="bg-gray-900 p-2 rounded flex items-center justify-between border border-gray-700">
                    <code id="api-key-display" class="text-xs text-gray-300 truncate mr-2">************************</code>
                    <button id="copy-api-key-btn" class="text-gray-400 hover:text-white" title="Copy API Key"><i class="fas fa-copy"></i></button>
                </div>
                <button id="generate-api-key-btn" class="mt-2 text-xs text-blue-400 hover:text-blue-300">Generate New Key</button>
            </div>
        </aside>

    </main>

    <!-- Modals -->
    <!-- Project Dashboard Modal -->
    <div id="dashboard-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 p-6 rounded-lg w-full max-w-2xl border border-gray-700 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Your Projects</h2>
                <button id="close-dashboard-btn" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="mb-6 flex space-x-2">
                <input type="text" id="new-project-name" placeholder="Project name (e.g. my-awesome-api)" class="flex-1 bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                <button id="create-project-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium">Create New</button>
            </div>
            
            <div id="project-list" class="space-y-2 max-h-96 overflow-y-auto">
                <!-- Projects injected here -->
                <div class="text-gray-500 text-center py-4">Loading projects...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let currentFile = null;
        let files = {};
        let projectId = null;
        let currentUser = null;

        // Monaco Editor Setup
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// Welcome to Arix-APP\n// Select or create a file to start coding',
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });
            
            editor.onDidChangeModelContent(() => {
                if (currentFile && files[currentFile]) {
                    files[currentFile].content = editor.getValue();
                }
            });
        });

        // OAuth Login Handlers
        document.getElementById('login-github-btn').addEventListener('click', () => {
            window.location.href = '/api/backend?action=auth&provider=github';
        });

        document.getElementById('login-google-btn').addEventListener('click', () => {
            window.location.href = '/api/backend?action=auth&provider=google';
        });

        // Check session and load dashboard
        async function checkSession() {
            try {
                const res = await fetch('/api/backend?action=session');
                const data = await res.json();
                if (data.user) {
                    currentUser = data.user;
                    document.getElementById('user-controls').innerHTML = `
                        <div class="flex items-center space-x-3">
                            <button id="open-dashboard-btn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm mr-2 flex items-center space-x-2"><i class="fas fa-layer-group"></i><span>Projects</span></button>
                            <img src="${data.user.avatar || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full border border-gray-600">
                            <span class="text-sm text-gray-300">${data.user.name || data.user.email}</span>
                            <button id="logout-btn" class="text-xs text-gray-500 hover:text-white ml-2">Logout</button>
                        </div>
                    `;
                    
                    document.getElementById('logout-btn').addEventListener('click', async () => {
                        await fetch('/api/backend?action=logout');
                        window.location.reload();
                    });
                    
                    document.getElementById('open-dashboard-btn').addEventListener('click', () => {
                        document.getElementById('dashboard-modal').classList.remove('hidden');
                        loadProjects();
                    });
                    
                    document.getElementById('close-dashboard-btn').addEventListener('click', () => {
                        document.getElementById('dashboard-modal').classList.add('hidden');
                    });
                    
                    // Show dashboard on load if no project selected
                    document.getElementById('dashboard-modal').classList.remove('hidden');
                    loadProjects();
                    loadApiKey();
                } else {
                     document.getElementById('editor-container').innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-gray-500 text-lg">Please login to start coding</div>`;
                }
            } catch (e) {
                console.error("Session check failed", e);
            }
        }

        // Project Management Dashboard
        async function loadProjects() {
            try {
                const res = await fetch('/api/backend?action=listProjects');
                const data = await res.json();
                const list = document.getElementById('project-list');
                list.innerHTML = '';
                
                if (data.projects && data.projects.length > 0) {
                    data.projects.forEach(pid => {
                        const div = document.createElement('div');
                        div.className = 'bg-gray-900 p-4 rounded flex justify-between items-center border border-gray-700 hover:border-blue-500 cursor-pointer transition';
                        div.innerHTML = `<span class="font-medium text-white">${pid.split('_').slice(1).join('_')}</span><span class="text-xs text-gray-500">${pid}</span>`;
                        div.onclick = () => selectProject(pid);
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = '<div class="text-gray-500 text-center py-4">No projects yet. Create one above!</div>';
                }
            } catch (e) {
                console.error("Failed to load projects", e);
            }
        }

        document.getElementById('create-project-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('new-project-name');
            const name = nameInput.value.trim();
            if (!name) return alert("Please enter a project name");
            
            try {
                const res = await fetch('/api/backend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'createProject', projectName: name })
                });
                const data = await res.json();
                if (data.success) {
                    nameInput.value = '';
                    loadProjects();
                    selectProject(data.projectId);
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) { alert("Failed to create project"); }
        });

        function selectProject(pid) {
            projectId = pid;
            document.getElementById('dashboard-modal').classList.add('hidden');
            files = {};
            currentFile = null;
            if(editor) editor.setValue('// Loading ' + pid + '...');
            loadFiles();
        }

        // File Tree Management
        async function loadFiles() {
            if (!projectId) return;
            try {
                const res = await fetch(`/api/backend?action=getFiles&projectId=${projectId}`);
                if (res.ok) {
                    files = await res.json();
                    renderFileTree();
                } else {
                    document.getElementById('file-tree').innerHTML = '<div class="text-gray-500 text-sm p-2">Failed to load files or no project found.</div>';
                }
            } catch (e) {
                console.error("Failed to load files", e);
            }
        }

        function renderFileTree() {
            const treeEl = document.getElementById('file-tree');
            treeEl.innerHTML = '';
            for (const path in files) {
                const fileEl = document.createElement('div');
                fileEl.className = 'flex items-center space-x-2 p-1 hover:bg-gray-700 cursor-pointer rounded text-sm text-gray-300';
                fileEl.innerHTML = `<i class="fas fa-file-code text-blue-400"></i><span>${path}</span>`;
                fileEl.onclick = () => openFile(path);
                treeEl.appendChild(fileEl);
            }
        }

        function openFile(path) {
            currentFile = path;
            const file = files[path];
            if (editor) {
                editor.setValue(file.content || '');
                // Simple language detection
                let lang = 'javascript';
                if (path.endsWith('.html')) lang = 'html';
                else if (path.endsWith('.css')) lang = 'css';
                else if (path.endsWith('.json')) lang = 'json';
                monaco.editor.setModelLanguage(editor.getModel(), lang);
            }
        }

        document.getElementById('new-file-btn').addEventListener('click', async () => {
            const name = prompt("Enter file name (e.g., api/hello.js):");
            if (name && !files[name]) {
                // Prevent basic path traversal in UI (server must also check)
                if (name.includes('..')) return alert("Invalid path");
                files[name] = { content: '// new file' };
                renderFileTree();
                openFile(name);
                // Save immediately
                await fetch('/api/backend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveFile', projectId, path: name, content: '// new file' })
                });
            }
        });

        // API Key Management
        async function loadApiKey() {
            try {
                const res = await fetch('/api/backend?action=getApiKey');
                if (res.ok) {
                    const data = await res.json();
                    if (data.apiKey) {
                        document.getElementById('api-key-display').innerText = data.apiKey;
                    }
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('generate-api-key-btn').addEventListener('click', async () => {
            if(!confirm("Generate a new API key? The old one will be invalidated.")) return;
            try {
                const res = await fetch('/api/backend?action=generateApiKey', { method: 'POST' });
                const data = await res.json();
                if (data.apiKey) {
                    document.getElementById('api-key-display').innerText = data.apiKey;
                }
            } catch (e) { alert("Failed to generate API key"); }
        });

        document.getElementById('copy-api-key-btn').addEventListener('click', () => {
            const key = document.getElementById('api-key-display').innerText;
            if(key && key !== '************************') {
                navigator.clipboard.writeText(key);
                alert("API Key copied!");
            }
        });

        // Deployment
        document.getElementById('deploy-btn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('deploy-status');
            const statusText = document.getElementById('deploy-status-text');
            const linkEl = document.getElementById('deploy-link');
            
            statusDiv.classList.remove('hidden');
            linkEl.classList.add('hidden');
            statusText.innerText = 'Saving & Deploying...';
            statusText.className = 'text-yellow-400';

            try {
                // First save all current files
                for (const path in files) {
                   await fetch('/api/backend', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveFile', projectId, path, content: files[path].content })
                    });
                }

                // Then trigger deploy
                const res = await fetch('/api/backend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'deploy', projectId })
                });
                
                const data = await res.json();
                if (res.ok && data.url) {
                    statusText.innerText = 'Deployed Successfully';
                    statusText.className = 'text-green-400';
                    linkEl.href = data.url;
                    linkEl.innerText = data.url;
                    linkEl.classList.remove('hidden');
                } else {
                    throw new Error(data.error || 'Deployment failed');
                }
            } catch (e) {
                statusText.innerText = 'Failed: ' + e.message;
                statusText.className = 'text-red-400';
            }
        });

        // Initial Load
        checkSession();
        
        console.log("Arix-APP initialized");
    </script>
</body>
</html>
