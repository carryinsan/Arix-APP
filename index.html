<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#212a38;--muted:#93a0b4;--text:#edf2f9;--accent:#7c8cff;--accent2:#4f6bff;--good:#44d39b;--warn:#f7c85e;--bad:#ff6b7d;--shadow:0 18px 60px rgba(0,0,0,.35);--radius:16px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 20% -20%,rgba(86,110,255,.12),transparent 65%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}button,input,select,textarea{font:inherit}button{color:inherit}.hidden{display:none!important}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.84);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#9aa6ff,#4f6bff);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 8px 30px rgba(79,107,255,.32)}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#131a24;border-radius:10px;padding:9px 12px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:#344056;transform:translateY(-1px)}.btn.primary{background:linear-gradient(180deg,#6379ff,#4f65f5);border-color:#6f82ff}.btn.ghost{background:transparent}.btn.danger{border-color:#5a2530;background:#241017}.iconbtn{width:36px;height:36px;padding:0;justify-content:center}.body{min-height:0;flex:1;display:grid;grid-template-columns:260px 1fr 320px}.sidebar{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;background:rgba(11,14,20,.72)}.sidebar .section{padding:14px}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#728098;margin:8px 0 10px}.project-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.project{padding:10px;border:1px solid transparent;border-radius:10px;cursor:pointer}.project:hover{background:#121824;border-color:#222c3d}.project.active{background:#141d2a;border-color:#36425b}.project .name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project .meta{font-size:11px;color:#718097;margin-top:4px}.new-project{display:flex;gap:7px}.new-project input{min-width:0}.field{width:100%;border:1px solid var(--line);background:#0b1017;color:var(--text);border-radius:10px;padding:10px 11px;outline:none}.field:focus{border-color:#4b60c8;box-shadow:0 0 0 3px rgba(79,107,255,.13)}.main{min-width:0;display:flex;flex-direction:column}.editor-head{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;background:#0b0f15}.tabs{display:flex;gap:4px;overflow:auto;min-width:0;flex:1}.tab{border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:8px;font-size:12px;color:#aab5c6;white-space:nowrap;cursor:pointer}.tab.active{background:#151c27;border-color:#273248;color:white}.status{font-size:11px;color:#7f8ba0}.editor-wrap{position:relative;min-height:0;flex:1;background:#070b11}.editor{height:100%;width:100%}.fallback-editor{height:100%;width:100%;background:#080c12;border:0;outline:none;color:#e8edf5;resize:none;padding:18px 20px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}.right{border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;background:rgba(9,12,17,.76)}.panel-tabs{display:flex;border-bottom:1px solid var(--line);overflow:auto}.panel-tab{flex:1;padding:12px 8px;font-size:12px;border:0;background:transparent;color:#8491a5;cursor:pointer;white-space:nowrap}.panel-tab.active{color:#fff;border-bottom:2px solid var(--accent)}.panel{padding:14px;overflow:auto;min-height:0;flex:1}.card{background:linear-gradient(180deg,rgba(18,24,34,.93),rgba(11,15,22,.95));border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow);margin-bottom:10px}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#0c121a;padding:4px 7px;border-radius:999px;font-size:10px;color:#aeb9c9}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.files{display:flex;flex-direction:column;gap:2px}.file-row{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12px}.file-row:hover{background:#141b26}.file-row.active{background:#172033}.tree-children{margin-left:14px}.drop{border:1px dashed #33425a;border-radius:12px;padding:18px;text-align:center;color:#8390a5}.drop.drag{border-color:#7b8cff;background:rgba(79,107,255,.08)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.64);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#0d131c;border:1px solid #29364a;border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.55);padding:18px}.modal h2{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 14px;color:#91a0b3;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:flex;flex-direction:column;gap:7px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0a1017}.empty{padding:24px 12px;text-align:center;color:#7f8ca1}.login{min-height:100%;display:grid;place-items:center;padding:20px}.login-card{width:min(520px,100%);background:linear-gradient(180deg,rgba(17,24,34,.95),rgba(10,14,20,.96));border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.4)}.login-card h1{font-size:34px;margin:0;letter-spacing:-.04em}.login-card p{color:#90a0b5}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;max-width:420px;background:#101822;border:1px solid #344055;border-radius:12px;padding:12px 14px;box-shadow:0 20px 70px rgba(0,0,0,.4);font-size:13px}.toast.bad{border-color:#6a2d39}.kbd{font:11px ui-monospace;padding:2px 5px;border:1px solid #313c4f;border-bottom-width:2px;border-radius:5px;color:#b4bfd0}.markdown pre{white-space:pre-wrap}.log{font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c3cfdf;background:#070b11;border:1px solid #1f2937;padding:11px;border-radius:10px;white-space:pre-wrap}.danger-note{border-left:3px solid var(--warn);padding-left:10px;color:#b8c3d3;font-size:12px}.api-key{word-break:break-all;font:11px ui-monospace;background:#070b11;padding:10px;border-radius:9px;border:1px solid #222d3d}.loading{opacity:.58;pointer-events:none}.sr{position:absolute;left:-9999px}.cm-editor{height:100%;font-size:13px}.cm-scroller{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.cm-gutters{background:#090e15!important;border-right:1px solid #18202c!important}.cm-activeLineGutter{background:#101722!important}.cm-activeLine{background:rgba(75,92,130,.08)!important}
@media(max-width:980px){.body{grid-template-columns:220px 1fr}.right{position:fixed;right:0;top:64px;bottom:0;width:min(370px,90vw);transform:translateX(100%);transition:.18s;z-index:30;box-shadow:-20px 0 60px rgba(0,0,0,.4)}.right.open{transform:none}.top-actions .mobile{display:inline-flex}}@media(max-width:680px){.body{grid-template-columns:1fr}.sidebar{display:none}.login-actions,.grid2{grid-template-columns:1fr}.top{padding:0 10px}.top .mobile{display:inline-flex}}
</style>

<body>
<div id="root"></div>
<div id="toastHost"></div>
<div id="modalHost"></div>
<script type="module">
const API='/api/backend';
const state={user:null,csrf:'',projects:[],project:null,files:[],openTabs:[],activePath:'',content:new Map(),dirty:new Set(),panel:'files',snapshots:[],deployments:[],env:[],keys:[],ais:[],rightOpen:false,editor:null};
const root=document.getElementById('root');
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,bad=false){const el=document.createElement('div');el.className='toast '+(bad?'bad':'');el.textContent=msg;$('#toastHost').appendChild(el);setTimeout(()=>el.remove(),3600)}
function apiUrl(action,params={}){const u=new URL(API,location.origin);u.searchParams.set('action',action);for(const [k,v] of Object.entries(params))if(v!==undefined&&v!==null)u.searchParams.set(k,v);return u.toString()}
async function api(action,{method='GET',body,auth=true}={}){const headers={};if(body!==undefined)headers['content-type']='application/json';if(auth&&state.csrf&&method!=='GET')headers['x-csrf-token']=state.csrf;const r=await fetch(apiUrl(action),{method,headers,body:body===undefined?undefined:JSON.stringify(body),credentials:'same-origin'});const d=await r.json().catch(()=>({ok:false,error:{message:'Invalid server response'}}));if(!r.ok||d?.ok===false){throw new Error(d?.error?.message||`Request failed (${r.status})`)}return d}
function loginUrl(provider){return apiUrl('oauth-start',{provider,mode:'login'})}
function renderLogin(){root.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="mark">A</div><div>Arix-App</div></div><div style="height:22px"></div><h1>Build. Deploy. Publish.</h1><p>A browser-native coding workspace with persistent Upstash state, versioned files, real Vercel deployments and an API-key layer for published AI endpoints.</p><div class="card"><div class="danger-note">No simulated deployments or fake AI responses are generated. Missing infrastructure configuration is reported explicitly.</div></div><div class="login-actions"><a class="btn primary" href="${loginUrl('google')}">Continue with Google</a><a class="btn" href="${loginUrl('github')}">Continue with GitHub</a></div><div style="height:14px"></div><div class="small muted">Session policy: 7-day inactivity window with a sliding server-side session TTL.</div></div></div>`}
function renderApp(){root.innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="mark">A</div><div>Arix-App</div><span class="pill" id="healthPill">Checking</span></div><div class="top-actions"><button class="btn ghost mobile" id="rightToggle">Panels</button><button class="btn" id="newProjectBtn">New project</button><button class="btn" id="apiKeyBtn">API keys</button><button class="btn" id="publishBtn">Publish AI</button><button class="btn ghost" id="logoutBtn">Sign out</button></div></header><div class="body"><aside class="sidebar"><div class="section"><div class="section-title">Projects</div><div class="new-project"><input id="newProjectInput" class="field" placeholder="project-name" maxlength="80"><button class="btn primary iconbtn" id="addProjectBtn">+</button></div></div><div class="section" style="min-height:0;flex:1"><div class="project-list" id="projectList"></div></div><div class="section"><div class="section-title">Security posture</div><div class="small muted">Secrets stay server-side. Cookies are HttpOnly + Secure. Paths are normalized server-side. Deployments go to Vercel rather than executing user code inside Arix-App.</div></div></aside><main class="main"><div class="editor-head"><div class="tabs" id="tabs"></div><span class="status" id="saveStatus">Ready</span><button class="btn iconbtn" id="saveBtn" title="Save (Ctrl+S)">↥</button></div><div class="editor-wrap"><div id="editor" class="editor"></div><textarea id="fallbackEditor" class="fallback-editor hidden" spellcheck="false"></textarea></div></main><aside class="right" id="rightPanel"><div class="panel-tabs"><button class="panel-tab active" data-panel="files">Files</button><button class="panel-tab" data-panel="deploy">Deploy</button><button class="panel-tab" data-panel="env">Env</button><button class="panel-tab" data-panel="history">History</button><button class="panel-tab" data-panel="github">GitHub</button><button class="panel-tab" data-panel="settings">Settings</button></div><div class="panel" id="panelBody"></div></aside></div></div>`;bindApp();loadHealth();loadProjects()}
function bindApp(){
 $('#logoutBtn').onclick=async()=>{try{await api('logout',{method:'POST'})}catch{} location.reload()};
 $('#addProjectBtn').onclick=createProject;$('#newProjectInput').onkeydown=e=>{if(e.key==='Enter')createProject()};$('#newProjectBtn').onclick=()=>$('#newProjectInput').focus();$('#apiKeyBtn').onclick=showKeysModal;$('#publishBtn').onclick=showPublishModal;$('#saveBtn').onclick=saveActive;
 $('#rightToggle').onclick=()=>$('#rightPanel').classList.toggle('open');document.querySelectorAll('.panel-tab').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveActive()}});
 const drop=$('#editor');document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){$('.editor-wrap').classList.add('drop')}});document.addEventListener('dragleave',()=>$('.editor-wrap')?.classList.remove('drop'));document.addEventListener('drop',async e=>{if(!e.dataTransfer?.files?.length)return;e.preventDefault();$('.editor-wrap').classList.remove('drop');await uploadFiles([...e.dataTransfer.files])});
}
async function loadHealth(){try{const d=await api('health',{auth:false});$('#healthPill').innerHTML=`<span class="dot"></span>${d.deployment?'Live deploy enabled':'Control plane only'}`}catch(e){$('#healthPill').textContent='Backend error'}}
async function loadProjects(){try{const d=await api('projects');state.projects=d;renderProjects();if(d.length){await openProject(d[0].id)}else{$('#panelBody').innerHTML=`<div class="empty">Create your first project. No seed project is inserted.</div>`}}catch(e){toast(e.message,true)}}
function renderProjects(){const el=$('#projectList');el.innerHTML=state.projects.length?state.projects.map(p=>`<div class="project ${state.project?.id===p.id?'active':''}" data-id="${esc(p.id)}"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.slug)} · r${p.revision||0}</div></div>`).join(''):`<div class="empty">No projects yet.</div>`;el.querySelectorAll('.project').forEach(x=>x.onclick=()=>openProject(x.dataset.id))}
async function createProject(){const name=$('#newProjectInput').value.trim();if(!name)return;try{const p=await api('projects-create',{method:'POST',body:{name,framework:'static'}});state.projects.unshift(p);$('#newProjectInput').value='';renderProjects();await openProject(p.id);toast('Project created')}catch(e){toast(e.message,true)}}
async function openProject(id){try{const r=await fetch(apiUrl('project',{id}),{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Project load failed');state.project=d;state.files=await (await fetch(apiUrl('files',{id}),{credentials:'same-origin'})).json();state.openTabs=[];state.activePath='';state.content.clear();state.dirty.clear();renderProjects();renderTabs();renderFilePanel();setPanel('files');}catch(e){toast(e.message,true)}}
function setPanel(name){state.panel=name;document.querySelectorAll('.panel-tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));if(name==='files')renderFilePanel();else if(name==='deploy')renderDeployPanel();else if(name==='env')renderEnvPanel();else if(name==='history')renderHistoryPanel();else if(name==='github')renderGitHubPanel();else renderSettingsPanel()}
function renderFilePanel(){if(!state.project){$('#panelBody').innerHTML=`<div class="empty">No project selected.</div>`;return}$('#panelBody').innerHTML=`<div class="row between"><div><div class="section-title" style="margin-top:0">${esc(state.project.name)}</div><div class="small muted">${esc(state.project.slug)}</div></div><button class="btn primary" id="uploadBtn">Upload</button><input id="filePicker" class="hidden" type="file" multiple></div><div style="height:10px"></div><div class="row"><input id="fileSearch" class="field" placeholder="Search files / content"><button class="btn iconbtn" id="searchBtn">⌕</button></div><div style="height:10px"></div><div class="row wrap"><button class="btn" id="newFileBtn">New file</button><button class="btn" id="newFolderBtn">New folder</button><button class="btn" id="downloadProjectBtn">Download</button><button class="btn" id="renameBtn">Rename</button><button class="btn" id="duplicateBtn">Duplicate</button><button class="btn danger" id="deleteBtn">Delete</button></div><div style="height:12px"></div><div class="files" id="fileTree"></div><div style="height:12px"></div><div class="drop" id="dropHelp">Drag files anywhere into the workspace.</div>`;renderTree();$('#uploadBtn').onclick=()=>$('#filePicker').click();$('#filePicker').onchange=e=>uploadFiles([...e.target.files]);$('#newFileBtn').onclick=()=>promptFile('file');$('#newFolderBtn').onclick=()=>promptFile('folder');$('#downloadProjectBtn').onclick=downloadProject;$('#renameBtn').onclick=renameActive;$('#duplicateBtn').onclick=duplicateActive;$('#deleteBtn').onclick=deleteActive;$('#searchBtn').onclick=searchFiles;$('#fileSearch').onkeydown=e=>{if(e.key==='Enter')searchFiles()}}
function renderTree(){const el=$('#fileTree');if(!el)return;const paths=[...state.files.map(f=>f.path)].sort();if(!paths.length){el.innerHTML='<div class="empty">No files yet.</div>';return}const root={children:{},files:[]};for(const p of paths){let node=root;const parts=p.split('/');for(let i=0;i<parts.length-1;i++){node.children[parts[i]] ??= {children:{},files:[]};node=node.children[parts[i]];}node.files.push(parts[parts.length-1]);}el.innerHTML=treeHTML(root,'');el.querySelectorAll('[data-path]').forEach(x=>x.onclick=()=>openFile(x.dataset.path));}
function treeHTML(node,prefix){let out='';for(const k of Object.keys(node.children).sort()){const child=node.children[k];out+=`<div class="file-row" style="font-weight:700">▾ ${esc(k)}</div><div class="tree-children">${treeHTML(child,prefix+k+'/')}</div>`}for(const f of node.files.sort()){const path=prefix+f;out+=`<div class="file-row ${state.activePath===path?'active':''}" data-path="${esc(path)}"><span>${fileIcon(path)}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f)}</span>${state.dirty.has(path)?'<span class="warn" style="margin-left:auto">●</span>':''}</div>`}return out}
function fileIcon(path){const ext=(path.split('.').pop()||'').toLowerCase();return ({html:'◇',js:'◈',mjs:'◈',css:'✦',json:'{}',md:'#',ts:'TS',tsx:'TS',jsx:'JS',png:'▧',jpg:'▧',jpeg:'▧',svg:'◇',txt:'T'})[ext]||'•'}
async function openFile(path){state.activePath=path;if(!state.openTabs.includes(path))state.openTabs.push(path);if(!state.content.has(path)){try{const r=await fetch(apiUrl('file',{id:state.project.id,path}),{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'File read failed');state.content.set(path,{base64:d.base64,mime:d.meta.mime});}catch(e){toast(e.message,true);return}}const item=state.content.get(path);const txt=base64ToText(item.base64,item.mime);await setEditorValue(txt);state.dirty.delete(path);renderTabs();renderTree();$('#saveStatus').textContent='Saved'}
function renderTabs(){const el=$('#tabs');el.innerHTML=state.openTabs.map(p=>`<button class="tab ${state.activePath===p?'active':''}" data-tab="${esc(p)}">${esc(p.split('/').pop())}${state.dirty.has(p)?' •':''}</button>`).join('');el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openFile(b.dataset.tab))}
async function ensureEditor(){if(state.editor||window.__cmFailed)return;if(!window.__cmLoaded){try{const [{EditorState},{EditorView},{keymap}]=await Promise.all([import('https://esm.sh/@codemirror/state@6.5.2'),import('https://esm.sh/@codemirror/view@6.36.5'),import('https://esm.sh/@codemirror/view@6.36.5?bundle')]);window.__cmModules={EditorState,EditorView,keymap};window.__cmLoaded=true;}catch{window.__cmFailed=true;$('#fallbackEditor').classList.remove('hidden');return}}
 try{const {EditorState,EditorView}=window.__cmModules;const [{basicSetup},{javascript}]=await Promise.all([import('https://esm.sh/codemirror@6.0.1'),import('https://esm.sh/@codemirror/lang-javascript@6.2.2')]);state.editor=new EditorView({state:EditorState.create({doc:'',extensions:[basicSetup,javascript(),EditorView.updateListener.of(v=>{if(v.docChanged&&state.activePath){state.dirty.add(state.activePath);$('#saveStatus').textContent='Unsaved';renderTabs();renderTree();}})]}),parent:$('#editor')});}catch{window.__cmFailed=true;$('#fallbackEditor').classList.remove('hidden')}}
function base64ToText(b64,mime){try{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!/^text\//.test(mime)&&!/javascript|json|typescript|xml/.test(mime))return '[Binary file — preview unavailable]';return new TextDecoder().decode(bytes)}catch{return ''}}
function bytesToB64(bytes){let out='';const step=0x8000;for(let i=0;i<bytes.length;i+=step){out+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)))}return btoa(out)}
function textToBase64(s){return bytesToB64(new TextEncoder().encode(s))}
async function setEditorValue(text){await ensureEditor();if(state.editor){const v=state.editor.state;state.editor.dispatch({changes:{from:0,to:v.doc.length,insert:text}})}else{$('#fallbackEditor').value=text}}
function currentEditorText(){if(state.editor)return state.editor.state.doc.toString();return $('#fallbackEditor').value}
async function saveActive(){if(!state.project||!state.activePath)return;const p=state.activePath;if(!state.dirty.has(p)){toast('No unsaved changes');return}const text=currentEditorText();if(text.startsWith('[Binary file')){toast('Binary file cannot be edited in text mode.',true);return}try{$('#saveStatus').textContent='Saving…';const b64=textToBase64(text);const r=await api('file-save',{method:'POST',body:{projectId:state.project.id,path:p,base64:b64,size:new TextEncoder().encode(text).byteLength,reason:'edit'}});state.content.set(p,{base64:b64,mime:r.meta?.mime||'text/plain'});state.dirty.delete(p);state.files=await api('files');state.project=await fetchProject();renderTabs();renderTree();$('#saveStatus').textContent='Saved';toast('Saved and versioned')}catch(e){$('#saveStatus').textContent='Save failed';toast(e.message,true)}}
async function fetchProject(){const r=await fetch(apiUrl('project',{id:state.project.id}),{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Project refresh failed');return d}
function promptFile(type){if(!state.project)return;showModal(type==='file'?'New file':'New folder',`${type==='file'?'Create a file.':'Create a folder marker; a .gitkeep file will be used because empty directories are not stored by Redis.'}`,`<input id="modalPath" class="field" placeholder="src/app.js">`,`<button class="btn primary" id="modalGo">Create</button>`);$('#modalGo').onclick=async()=>{const path=$('#modalPath').value.trim();if(!path)return;try{if(type==='folder'){const p=normalizeFolderPath(path);await api('file-create',{method:'POST',body:{projectId:state.project.id,path:`${p}/.gitkeep`}})}else await api('file-create',{method:'POST',body:{projectId:state.project.id,path}});$('#modalHost').innerHTML='';state.files=await api('files');renderTree();toast('Created')}catch(e){toast(e.message,true)}}}
function normalizeFolderPath(p){let s=p.replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');if(!s||s.includes('..'))throw new Error('Invalid folder path');return s}
async function renameActive(){if(!state.project||!state.activePath)return toast('Open a file first',true);const next=prompt('Rename/move path',state.activePath);if(!next||next===state.activePath)return;try{await api('file-rename',{method:'POST',body:{projectId:state.project.id,from:state.activePath,to:next}});state.files=await api('files');const old=state.activePath;const txt=state.content.get(old);state.content.delete(old);state.content.set(next,txt);state.activePath=next;state.openTabs=state.openTabs.map(x=>x===old?next:x);renderTabs();renderTree();toast('File moved/renamed')}catch(e){toast(e.message,true)}}
async function duplicateActive(){if(!state.project||!state.activePath)return toast('Open a file first',true);const next=prompt('Duplicate to path',state.activePath.replace(/(\.[^./]+)$/,'.copy$1'));if(!next)return;try{await api('file-duplicate',{method:'POST',body:{projectId:state.project.id,from:state.activePath,to:next}});state.files=await api('files');renderTree();toast('File duplicated')}catch(e){toast(e.message,true)}}
async function deleteActive(){if(!state.project||!state.activePath)return toast('Open a file first',true);if(!confirm(`Delete ${state.activePath}?`))return;try{await api('file-delete',{method:'POST',body:{projectId:state.project.id,path:state.activePath}});state.files=await api('files');state.content.delete(state.activePath);state.openTabs=state.openTabs.filter(x=>x!==state.activePath);state.activePath=state.openTabs.at(-1)||'';renderTabs();renderTree();if(state.activePath)await openFile(state.activePath);else await setEditorValue('');toast('File deleted')}catch(e){toast(e.message,true)}}
async function uploadFiles(files){if(!state.project||!files.length)return;for(const f of files){if(f.name.toLowerCase().endsWith('.zip')){try{const JSZip=(await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm')).default;const zip=await JSZip.loadAsync(await f.arrayBuffer());for(const [name,z] of Object.entries(zip.files)){if(z.dir)continue;const clean=name.replace(/\\/g,'/');const blob=await z.async('uint8array');await saveUploaded(clean,blob)}}catch(e){toast('ZIP import failed: '+e.message,true)}continue}await saveUploaded(f.webkitRelativePath||f.name,new Uint8Array(await f.arrayBuffer()))}state.files=await api('files');renderTree();toast('Upload complete')}
async function saveUploaded(path,bytes){const base64=bytesToB64(bytes);await api('file-save',{method:'POST',body:{projectId:state.project.id,path,base64,size:bytes.byteLength,reason:'upload'}})}
async function searchFiles(){const q=$('#fileSearch')?.value.trim();if(!q)return;try{const d=await fetch(apiUrl('file-search',{id:state.project.id,q}),{credentials:'same-origin'}).then(x=>x.json());if(d.length)showModal('Search results',`Matches for “${esc(q)}”`,d.map(x=>`<div class="card"><b>${esc(x.path)}</b><div class="small muted">${esc(x.preview)}</div></div>`).join(''),`<button class="btn" id="closeSearch">Close</button>`);else showModal('Search results','',`<div class="empty">No matches.</div>`,`<button class="btn" id="closeSearch">Close</button>`)}catch(e){toast(e.message,true)}}
async function downloadProject(){if(!state.project)return;try{const JSZip=(await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm')).default;const zip=new JSZip();for(const m of state.files){const f=await fetch(apiUrl('file',{id:state.project.id,path:m.path}),{credentials:'same-origin'}).then(x=>x.json());const bin=atob(f.base64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));zip.file(m.path,bytes)}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.project.slug}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){toast(e.message,true)}}
async function renderDeployPanel(){if(!state.project){$('#panelBody').innerHTML='<div class="empty">No project selected.</div>';return}const deps=await api('deployments',{auth:true});state.deployments=deps;$('#panelBody').innerHTML=`<div class="row between"><div><div class="section-title" style="margin-top:0">Deployments</div><div class="small muted">Real Vercel deployments; no local code execution.</div></div><button class="btn primary" id="deployNow">Deploy</button></div><div style="height:12px"></div><div class="card"><div class="small muted">Latest</div><div id="latestDeploy">${deps[0]?deployCard(deps[0]):'<div class="empty">No deployments yet.</div>'}</div></div><div class="section-title">History</div><div class="list">${deps.map(deployCard).join('')}</div>`;$('#deployNow').onclick=()=>deployNow('production');document.querySelectorAll('[data-open-dep]').forEach(b=>b.onclick=()=>openDeployment(b.dataset.openDep));document.querySelectorAll('[data-rollback]').forEach(b=>b.onclick=()=>rollbackDeployment(b.dataset.rollback))}
function deployCard(d){return `<div class="list-item"><div><b>${esc((d.status||'QUEUED').toUpperCase())}</b><div class="tiny muted">${new Date(d.createdAt).toLocaleString()} · ${esc(d.target||'preview')}</div></div><div class="row"><button class="btn" data-open-dep="${esc(d.id)}">Open</button><button class="btn" data-rollback="${esc(d.id)}">Rollback</button></div></div>`}
async function openDeployment(id){try{const d=await api('deployment',{auth:true});const r=await fetch(apiUrl('deployment',{id}),{credentials:'same-origin'});const x=await r.json();if(!r.ok)throw new Error(x?.error?.message||'Deployment read failed');const lg=await fetch(apiUrl('logs',{id}),{credentials:'same-origin'}).then(z=>z.json()).catch(()=>({events:[]}));showModal('Deployment details',`${esc(x.status||'unknown')} · ${esc(x.target||'preview')}`,`<div class="card"><div class="small muted">URL</div><div class="api-key">${esc(x.url||'not assigned yet')}</div><div style="height:10px"></div><div class="small muted">Build events</div><div class="log">${esc(JSON.stringify(lg.events||[],null,2))}</div></div>`,`<button class="btn" id="depClose">Close</button>`);$('#depClose').onclick=()=>$('#modalHost').innerHTML=''}catch(e){toast(e.message,true)}}
async function rollbackDeployment(id){const d=state.deployments.find(x=>x.id===id);if(!d?.snapshotId){toast('No snapshot is attached to this deployment.',true);return}if(!confirm('Restore this deployment snapshot?'))return;try{await api('rollback',{method:'POST',body:{projectId:state.project.id,snapshotId:d.snapshotId}});state.files=await api('files');state.content.clear();state.openTabs=[];state.activePath='';renderTabs();renderTree();toast('Snapshot restored')}catch(e){toast(e.message,true)}}
async function deployNow(target){try{await saveActive();const d=await api('deploy',{method:'POST',body:{projectId:state.project.id,target}});toast(`Deployment ${d.status||'queued'}`);renderDeployPanel()}catch(e){toast(e.message,true)}}
async function renderEnvPanel(){if(!state.project)return;state.env=await api('env');$('#panelBody').innerHTML=`<div class="row between"><div><div class="section-title" style="margin-top:0">Environment</div><div class="small muted">Encrypted in Upstash. Values are never returned to the browser after save.</div></div><button class="btn primary" id="envAdd">Add</button></div><div style="height:10px"></div><div class="list">${state.env.map(v=>`<div class="list-item"><div><b>${esc(v.key)}</b><div class="tiny muted">${esc(v.target.join(', '))} · masked</div></div><button class="btn danger" data-env-del="${esc(v.key)}">Delete</button></div>`).join('')||'<div class="empty">No environment variables.</div>'}</div>`;$('#envAdd').onclick=()=>showEnvModal();document.querySelectorAll('[data-env-del]').forEach(b=>b.onclick=()=>delEnv(b.dataset.envDel))}
function showEnvModal(){showModal('Add environment variable','The value is encrypted server-side and synced to Vercel on deployment.',`<div class="grid2"><input id="envKey" class="field" placeholder="API_KEY"><select id="envTarget" class="field"><option value="production">Production</option><option value="preview">Preview</option><option value="development">Development</option></select></div><div style="height:8px"></div><textarea id="envValue" class="field" style="min-height:120px" placeholder="secret value"></textarea>`,`<button class="btn primary" id="envSave">Save</button><button class="btn" id="envCancel">Cancel</button>`);$('#envCancel').onclick=()=>$('#modalHost').innerHTML='';$('#envSave').onclick=async()=>{try{await api('env-upsert',{method:'POST',body:{projectId:state.project.id,key:$('#envKey').value,value:$('#envValue').value,target:[$('#envTarget').value]}});$('#modalHost').innerHTML='';renderEnvPanel();toast('Encrypted environment variable saved')}catch(e){toast(e.message,true)}}}
async function delEnv(key){if(!confirm(`Delete ${key}?`))return;try{await api('env-delete',{method:'POST',body:{projectId:state.project.id,key}});renderEnvPanel();toast('Deleted')}catch(e){toast(e.message,true)}}
async function renderHistoryPanel(){if(!state.project)return;state.snapshots=await api('snapshots');$('#panelBody').innerHTML=`<div class="section-title" style="margin-top:0">Version history</div><div class="small muted">Every meaningful file change creates an immutable snapshot manifest.</div><div style="height:12px"></div><div class="list">${state.snapshots.map(s=>`<div class="list-item"><div><b>r${s.revision}</b><div class="tiny muted">${esc(s.reason)} · ${new Date(s.createdAt).toLocaleString()} · ${s.fileCount} files</div></div><button class="btn" data-rollback-snap="${esc(s.id)}">Restore</button></div>`).join('')||'<div class="empty">No snapshots.</div>'}</div>`;document.querySelectorAll('[data-rollback-snap]').forEach(b=>b.onclick=async()=>{if(!confirm('Restore this snapshot?'))return;try{await api('rollback',{method:'POST',body:{projectId:state.project.id,snapshotId:b.dataset.rollbackSnap}});state.files=await api('files');state.content.clear();state.openTabs=[];state.activePath='';renderTree();renderTabs();toast('Snapshot restored')}catch(e){toast(e.message,true)}})}
async function renderGitHubPanel(){const connected=!!state.user?.githubToken;$('#panelBody').innerHTML=`<div class="section-title" style="margin-top:0">GitHub</div><div class="card"><div class="small">Connect a GitHub account with repository access to import repos and configure push webhooks.</div><div style="height:9px"></div><a class="btn primary" href="${apiUrl('oauth-start',{provider:'github',mode:'import'})}">Connect GitHub for repo access</a></div><div class="card"><div class="row between"><b>Repository</b><button class="btn" id="loadRepos">Load repos</button></div><div id="repoList" class="empty">No repository list loaded.</div></div><div class="card"><button class="btn primary" id="githubHook">Enable push auto-deploy</button><div class="tiny muted" style="margin-top:7px">Creates a signed GitHub push webhook for this project after a repository is connected/imported.</div></div>`;$('#loadRepos').onclick=loadRepos;$('#githubHook').onclick=async()=>{try{const d=await api('github-webhook-create',{method:'POST',body:{projectId:state.project.id}});toast(`Webhook ${d.hookId} configured`)}catch(e){toast(e.message,true)}}}
async function loadRepos(){try{const repos=await api('github-repos');const el=$('#repoList');el.innerHTML=repos.length?repos.map(r=>`<div class="list-item"><div><b>${esc(r.fullName)}</b><div class="tiny muted">${r.private?'Private':'Public'} · ${esc(r.defaultBranch)}</div></div><button class="btn" data-repo="${esc(r.fullName)}" data-ref="${esc(r.defaultBranch)}">Import</button></div>`).join(''):'<div class="empty">No repositories returned by GitHub.</div>';el.querySelectorAll('[data-repo]').forEach(b=>b.onclick=()=>{const [owner,repo]=b.dataset.repo.split('/');importRepo(owner,repo,b.dataset.ref)})}catch(e){toast(e.message,true)}}
async function importRepo(owner,repo,ref){try{await api('github-import',{method:'POST',body:{projectId:state.project.id,owner,repo,ref}});state.files=await api('files');renderTree();toast('Repository imported');}catch(e){toast(e.message,true)}}
async function renderSettingsPanel(){const u=state.user||{};$('#panelBody').innerHTML=`<div class="section-title" style="margin-top:0">Project settings</div><div class="card"><label class="small muted">Name</label><input id="setName" class="field" value="${esc(state.project?.name||'')}"><div style="height:8px"></div><div class="grid2"><input id="setInstall" class="field" placeholder="npm install" value="${esc(state.project?.installCommand||'')}"><input id="setBuild" class="field" placeholder="npm run build" value="${esc(state.project?.buildCommand||'')}"></div><div style="height:8px"></div><input id="setOut" class="field" placeholder="dist" value="${esc(state.project?.outputDirectory||'')}"><div style="height:10px"></div><button class="btn primary" id="saveSettings">Save settings</button></div><div class="card"><div class="small muted">Account</div><div style="height:6px"></div><b>${esc(u.name||'')}</b><div class="tiny muted">${esc(u.email||'')}</div><div style="height:8px"></div><div class="tiny muted">Last session refresh: ${state.user?.sessionExpiresAt?new Date(state.user.sessionExpiresAt).toLocaleString():'server-managed'}</div></div><div class="card"><div class="small muted">Platform principle</div><div class="danger-note">Arix-App never promises “hackless” or “errorless” operation. It minimizes common attack paths and reports configuration gaps instead of fabricating success.</div></div>`;$('#saveSettings').onclick=saveSettings}
async function saveSettings(){try{state.project=await api('project-update',{method:'PATCH',body:{id:state.project.id,name:$('#setName').value,installCommand:$('#setInstall').value,buildCommand:$('#setBuild').value,outputDirectory:$('#setOut').value}}).then(x=>x);renderProjects();toast('Settings saved')}catch(e){toast(e.message,true)}}
function showModal(title,subtitle,body,actions){$('#modalHost').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><div class="row between"><div><h2>${title}</h2><p>${subtitle||''}</p></div><button class="btn iconbtn" id="closeModal">×</button></div>${body||''}<div class="row" style="justify-content:flex-end;margin-top:14px">${actions||''}</div></div></div>`;$('#closeModal').onclick=()=>$('#modalHost').innerHTML='';$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')$('#modalHost').innerHTML=''}}
async function showKeysModal(){try{state.keys=await api('api-keys');const list=state.keys.map(k=>`<div class="list-item"><div><b>${esc(k.name)}</b><div class="tiny muted">${new Date(k.createdAt).toLocaleString()} · ${esc(k.status)}</div></div><button class="btn danger" data-revoke="${esc(k.id)}">Revoke</button></div>`).join('')||'<div class="empty">No API keys yet.</div>';showModal('Arix API keys','Keys are shown only once. Store them in your own secret manager.',list+'<div style="height:10px"></div><input id="keyName" class="field" placeholder="Key name">',`<button class="btn primary" id="newKey">Create key</button>`);$('#newKey').onclick=async()=>{try{const d=await api('api-key-create',{method:'POST',body:{name:$('#keyName').value||'Arix API key'}});showModal('API key created','Copy it now. Arix-App does not show the secret again.',`<div class="api-key">${esc(d.apiKey)}</div><div style="height:10px"></div><div class="small muted">Use Authorization: Bearer &lt;key&gt; with POST /api/backend?action=public-ai after you publish an AI.</div>`,`<button class="btn primary" id="keyDone">Done</button>`);$('#keyDone').onclick=()=>showKeysModal()}catch(e){toast(e.message,true)}}}catch(e){toast(e.message,true)}document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{try{await api('api-key-revoke',{method:'POST',body:{id:b.dataset.revoke}});showKeysModal()}catch(e){toast(e.message,true)}})}
async function showPublishModal(){try{state.ais=await api('ai-list');const existing=state.ais.map(a=>`<div class="list-item"><div><b>${esc(a.name)}</b><div class="tiny muted">/${esc(a.slug)} · ${esc(a.status)}</div></div></div>`).join('');showModal('Publish AI','Publishing creates a real persistent AI manifest in Upstash and an API endpoint. Invocation is only enabled when the server-side AI runtime is configured.',`<div class="grid2"><input id="aiName" class="field" placeholder="Customer Support AI"><input id="aiSlug" class="field" placeholder="customer-support"></div><div style="height:8px"></div><textarea id="aiPrompt" class="field" style="min-height:120px" placeholder="System instructions"></textarea><div style="height:12px"></div>${existing}`,`<button class="btn primary" id="aiPublishGo">Publish</button>`);$('#aiPublishGo').onclick=async()=>{try{const d=await api('ai-publish',{method:'POST',body:{name:$('#aiName').value,slug:$('#aiSlug').value,systemPrompt:$('#aiPrompt').value}});showModal('AI published','The manifest is live in Arix-App. No fake inference is generated.',`<div class="card"><b>${esc(d.name)}</b><div class="small muted">Endpoint</div><div class="api-key">${esc(d.invokeEndpoint)}</div><div style="height:6px"></div><div class="tiny ${d.configurationReady?'good':'warn'}">${d.configurationReady?'AI runtime configured':'AI runtime not configured — endpoint will return an explicit configuration error, not a simulated answer.'}</div></div>`,`<button class="btn primary" id="pubDone">Done</button>`);$('#pubDone').onclick=()=>showPublishModal()}catch(e){toast(e.message,true)}}}catch(e){toast(e.message,true)}}
(async()=>{try{const d=await api('me');state.user=d.user;state.csrf=d.csrf;renderApp()}catch{renderLogin()}})();
</script>
</body>
</html>
